[package]
name = "iii-iv-example"
version = "0.0.0"
description = "III-IV: Sample service and template"
authors = ["Julio Merino <julio@meroh.net>"]
edition = "2024"
publish = false

[lints]
workspace = true

[dependencies]
axum = { workspace = true }
axum-server = { workspace = true }
env_logger = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio", "tls-rustls", "sqlite"] }
tokio = { workspace = true, features = ["rt", "macros", "rt-multi-thread"] }

[dependencies.iii-iv-core]
path = "../core"
features = ["postgres"]

[dependencies.derive_more]
workspace = true
features = ["as_ref", "constructor"]

[dev-dependencies.iii-iv-core]
path = "../core"
features = ["sqlite", "testutils"]
