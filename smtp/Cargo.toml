[package]
name = "iii-iv-smtp"
version = "0.0.0"
description = "III-IV: SMTP support"
authors = ["Julio Merino <julio@meroh.net>"]
edition = "2024"
publish = false

[lints]
workspace = true

[features]
default = ["postgres"]
postgres = ["dep:sqlx", "iii-iv-core/postgres", "sqlx/postgres"]
sqlite = ["dep:sqlx", "iii-iv-core/sqlite", "sqlx/sqlite"]
testutils = ["dep:futures", "dep:env_logger", "iii-iv-core/sqlite"]

[dependencies]
ammonia = { workspace = true }
async-trait = { workspace = true }
env_logger = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
iii-iv-core = { path = "../core" }
mailparse = { workspace = true }
time = { workspace = true }
url = { workspace = true }

[dependencies.lettre]
workspace = true
features = ["builder", "hostname", "pool", "rustls-tls", "smtp-transport", "tokio1-rustls-tls"]

[dependencies.sqlx]
version = "0.9"
optional = true
features = ["runtime-tokio", "tls-rustls", "time"]

[dev-dependencies]
env_logger = { workspace = true }
futures = { workspace = true }
iii-iv-core = { path = "../core", features = ["sqlite", "testutils"] }
serial_test = { workspace = true }
temp-env = { workspace = true }
time = { workspace = true, features = ["macros"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[dev-dependencies.sqlx]
workspace = true
features = ["runtime-tokio", "tls-rustls", "sqlite", "time"]
